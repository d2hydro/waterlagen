# Voorbeeld voor waterlopen: plaats deze TOML naast de map source_data,
# of pas de paden aan. De bronbestanden moeten al aanwezig zijn.
# Relatieve paden zijn relatief aan dit TOML-bestand.
# Hoogste prioriteitsgetal wint. De volgorde hieronder bepaalt geen voorrang.
# HYDAMO primair (-200 m) en secundair (-100 m) gaan altijd voor.
[defaults]
brandwaarde = -40.0

[[lagen]]
path = "source_data/bgt/bgt.gpkg"
layer = "bgt_waterdeel"
prioriteit = 2

[[lagen]]
path = "source_data/top10nl/top10nl_Compleet.gpkg"
layer = "top10nl_waterdeel_vlak"
prioriteit = 1

[[lagen]]
path = "source_data/top10nl/top10nl_Compleet.gpkg"
layer = "top10nl_waterdeel_lijn"
prioriteit = 1

# Duikerselecties voor deze voorbeeldtegel inclusief buffer.
# Voor een ander gebied moeten deze selecties opnieuw worden gemaakt.
# BGT: alleen kunstwerkdelen met plus-type = duiker.
[[lagen]]
path = "processed_data/brandlagen/178000_388000_192000_402000/bgt_duikers.gpkg"
layer = "bgt_duiker"
brandwaarde = -40.0
prioriteit = 2

# OSM: alleen tunnel=culvert, met de laagste prioriteit.
[[lagen]]
path = "processed_data/brandlagen/178000_388000_192000_402000/osm_duikers.gpkg"
layer = "osm_culvert"
brandwaarde = -40.0
prioriteit = 0

# Optioneel: eigen waterloopcorrecties gaan voor BGT en TOP10NL.
# [[lagen]]
# path = "eigen_brandlagen.gpkg"
# layer = "correcties"
# prioriteit = 3
# Een dam of blokkering vraagt een positieve brandwaarde, bijvoorbeeld:
# brandwaarde = 1.0
