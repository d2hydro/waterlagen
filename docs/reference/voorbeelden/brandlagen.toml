# Voorbeeld voor waterlopen: plaats deze TOML naast de map source_data,
# of pas de paden aan. De bronbestanden moeten al aanwezig zijn.
# Relatieve paden zijn relatief aan dit TOML-bestand.
# Hoogste prioriteitsgetal wint. De volgorde hieronder bepaalt geen voorrang.
# Gezamenlijke water-/duikerverwerking op het bestaande 2m-raster.
geisoleerde_branddiepte_m = 10.0

# Fallback voor gewone brandlagen; water en duikers krijgen hun diepte
# uit de HYDAMO-verbinding; aanvullende lagen behouden hun ingestelde verlaging.
[defaults]
brandwaarde = -10.0

[[lagen]]
path = "source_data/bgt/bgt.gpkg"
layer = "bgt_waterdeel"
rol = "water"
prioriteit = 2

[[lagen]]
path = "source_data/top10nl/top10nl_Compleet.gpkg"
layer = "top10nl_waterdeel_vlak"
brandwaarde = -5.0
rol = "water"
prioriteit = 1

[[lagen]]
path = "source_data/top10nl/top10nl_Compleet.gpkg"
layer = "top10nl_waterdeel_lijn"
brandwaarde = -5.0
rol = "water"
prioriteit = 1

# Duikerselecties voor deze voorbeeldtegel inclusief buffer.
# Voor een ander gebied moeten deze selecties opnieuw worden gemaakt.
# BGT: alleen kunstwerkdelen met plus-type = duiker.
[[lagen]]
path = "processed_data/brandlagen/178000_388000_192000_402000/bgt_duikers.gpkg"
layer = "bgt_duiker"
rol = "duiker"
bron = "bgt"
prioriteit = 2

# OSM: alleen tunnel=culvert; bronvoorkeur HYDAMO, BGT, OSM.
[[lagen]]
path = "processed_data/brandlagen/178000_388000_192000_402000/osm_duikers.gpkg"
layer = "osm_culvert"
rol = "duiker"
bron = "osm"
prioriteit = 0

# Optioneel: OSM-kanalen als aanvullende waterlijnen, standaard uit.
# Download eerst met docs/reference/voorbeelden/download_osm_canals.py.
# Dit selecteert waterway=canal zonder ondergrondse trajecten.
# Verwijder daarna de # voor de volgende zeven regels om deze laag te gebruiken.
# [[lagen]]
# path = "source_data/osm/osm_canals.gpkg"
# layer = "osm_canals"
# rol = "water"
# bron = "osm"
# brandwaarde = -5.0
# prioriteit = -1

# Optioneel: BGT-wegdelen verhogen, standaard uit. Pas de proefwaarde aan.
# [[lagen]]
# path = "source_data/bgt/bgt.gpkg"
# layer = "bgt_wegdeel"
# rol = "overig"
# brandwaarde = 0.10
# prioriteit = 3

# Optioneel: eigen waterloopcorrecties gaan voor BGT en TOP10NL.
# [[lagen]]
# path = "eigen_brandlagen.gpkg"
# layer = "correcties"
# prioriteit = 3
# Een dam of blokkering vraagt een positieve brandwaarde, bijvoorbeeld:
# brandwaarde = 1.0
