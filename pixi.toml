[workspace]
name = "Waterlagen"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = ">=3.11"
gdal = "*"
geopandas = "*"
pydantic = ">=2"
pydantic-settings = "*"
rasterio = "*"
pyogrio = "*"
pyproj = "*"
pyarrow = "*"
numpy = "*"
requests = "*"
shapely = "*"
affine = "*"
tqdm = "*"

[feature.dev.dependencies]
mypy = "*"
pip = "*"
pytest = "*"
pytest-cov = "*"
ruff = "*"

[feature.dev.tasks]
test-cov = "pytest --cov=src/waterlagen --cov-report=term-missing"
functioneel_landgebruik = "python scripts/functioneel_landgebruik.py"
inwoners = "python scripts/inwoners.py"
auto = "python scripts/auto.py"
autos = "python scripts/autos.py"
statistiek_inwoners_autos = "python scripts/statistiek_inwoners_autos.py"

[feature.docs.dependencies]
mkdocs = "*"
mkdocs-material = "*"
mkdocs-jupyter = "*"
pymdown-extensions = "*"
# mkdocstrings: installeer met python handler
# (conda-forge heeft vaak mkdocstrings-python als aparte pkg)
mkdocstrings = "*"
mkdocstrings-python = "*"

[feature.afwateringseenheden.dependencies]
pcraster = "*"

[feature.docs.tasks]
docs-serve = "mkdocs serve --livereload"
docs-build = "mkdocs build --strict"
docs-deploy = "mkdocs gh-deploy --force"

[pypi-dependencies]
waterlagen = { path = ".", editable = true }
ipykernel = "*"

[environments]
default = ["dev"]
docs = ["docs", "dev"]
afwateringseenheden = ["dev", "afwateringseenheden"]
