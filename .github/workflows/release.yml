name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  tests:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set package version from release tag
        shell: bash
        run: |
          tag_version="$RELEASE_TAG"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${tag_version#v}" >> "$GITHUB_ENV"

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.70.1
          cache: true

      - name: Run tests
        run: pixi run --environment default pytest

  build:
    name: Build distributions
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set package version from release tag
        shell: bash
        run: |
          tag_version="$RELEASE_TAG"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${tag_version#v}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build distributions
        run: python -m build

      - name: Verify version matches release tag
        shell: bash
        run: |
          tag_version="$RELEASE_TAG"
          tag_version="${tag_version#v}"
          wheel="$(find dist -maxdepth 1 -name 'waterlagen-*.whl' -print -quit)"
          python -m pip install --no-deps "$wheel"
          package_version="$(python -c "from importlib.metadata import version; print(version('waterlagen'))")"
          test "$package_version" = "$tag_version"

      - name: Store distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/waterlagen
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  production-build:
    name: Build standalone production bundle
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.70.1
          run-install: false
          cache: false

      - name: Build and lock against the published PyPI release
        shell: bash
        run: |
          # PyPI indexes may take a short time to expose a newly uploaded wheel.
          for attempt in 1 2 3 4 5; do
            if python tools/build_production_bundle.py --tag "$RELEASE_TAG" --output-dir dist; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 15; fi
          done
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: production-bundle
          path: dist/waterlagen-productie-*.zip
          if-no-files-found: error

  production-test:
    name: Test standalone bundle (${{ matrix.os }})
    needs: production-build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Deliberately no checkout: the ZIP must work without repository files.
      - uses: actions/download-artifact@v8
        with:
          name: production-bundle
          path: dist

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.70.1
          run-install: false
          cache: false

      - name: Unpack, install and check the release environment
        shell: bash
        run: |
          python -m zipfile -e "dist/waterlagen-productie-$RELEASE_TAG.zip" production
          cd "production/waterlagen-productie-$RELEASE_TAG"
          pixi install --locked
          pixi run --locked controleer

  production-upload:
    name: Attach tested production ZIP to the GitHub release
    needs: production-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: production-bundle
          path: dist

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "dist/waterlagen-productie-$RELEASE_TAG.zip" --repo "$GITHUB_REPOSITORY"
