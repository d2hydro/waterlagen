name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag (version must already be on PyPI)"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

jobs:
  tests:
    name: Test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set package version from release tag
        shell: bash
        run: |
          tag_version="$RELEASE_TAG"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${tag_version#v}" >> "$GITHUB_ENV"

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.70.1
          environments: afwateringseenheden
          cache: true

      - name: Run tests
        run: pixi run --environment afwateringseenheden pytest

  build:
    name: Build distributions
    if: github.event_name == 'release'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set package version from release tag
        shell: bash
        run: |
          tag_version="$RELEASE_TAG"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${tag_version#v}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build distributions
        run: python -m build

      - name: Verify version matches release tag
        shell: bash
        run: |
          tag_version="$RELEASE_TAG"
          tag_version="${tag_version#v}"
          wheel="$(find dist -maxdepth 1 -name 'waterlagen-*.whl' -print -quit)"
          python -m pip install --no-deps "$wheel"
          package_version="$(python -c "from importlib.metadata import version; print(version('waterlagen'))")"
          test "$package_version" = "$tag_version"

      - name: Store distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/waterlagen
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  production-build:
    name: Build standalone production bundle
    needs: publish
    # A manual run deliberately skips publication; a release run requires it.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Older tags may not contain the builder. Manual runs use the selected
          # workflow commit, while the package version comes from RELEASE_TAG.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.release.tag_name }}

      - name: Verify the target GitHub release exists
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.70.1
          run-install: false
          cache: false

      - name: Build and lock against the published PyPI release
        shell: bash
        run: |
          # Allow time for PyPI index propagation after publication.
          for attempt in {1..10}; do
            echo "Building production bundle for $RELEASE_TAG (attempt $attempt/10)"
            if python tools/build_production_bundle.py --tag "$RELEASE_TAG" --output-dir dist; then
              exit 0
            fi
            if [ "$attempt" -lt 10 ]; then
              sleep 30
              # A new project directory still shares Pixi's cached PyPI index.
              # Keep the Conda cache, but fetch fresh PyPI metadata next time.
              pixi clean cache --pypi --yes
            fi
          done
          echo "::error::Could not build the production bundle for $RELEASE_TAG after 10 attempts."
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: production-bundle
          path: dist/waterlagen-productie.zip
          if-no-files-found: error

  production-test:
    name: Test standalone bundle (${{ matrix.os }})
    needs: production-build
    if: ${{ !cancelled() && needs.production-build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Deliberately no checkout: the ZIP must work without repository files.
      - uses: actions/download-artifact@v8
        with:
          name: production-bundle
          path: dist

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.70.1
          run-install: false
          cache: false

      - name: Unpack, install and check the release environment
        shell: bash
        run: |
          python -m zipfile -e dist/waterlagen-productie.zip production
          cd production
          pixi install --locked
          pixi run --locked controleer
          # Run the updater entry point without downloading or applying a release.
          if [ "$RUNNER_OS" = "Windows" ]; then
            MSYS_NO_PATHCONV=1 cmd.exe /d /c "code_bijwerken.cmd --help"
          else
            sh ./code_bijwerken.sh --help
          fi

  production-upload:
    name: Attach tested production ZIP to the GitHub release
    needs: production-test
    if: ${{ !cancelled() && needs.production-test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: production-bundle
          path: dist

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/waterlagen-productie.zip --repo "$GITHUB_REPOSITORY"
