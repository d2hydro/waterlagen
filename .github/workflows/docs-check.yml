name: Documentation checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.70.1
          environments: docs
          cache: true

      - name: Check executable examples without network access
        run: pixi run --locked --environment docs pytest tests/test_python_examples.py

      - name: Build documentation
        run: pixi run --locked --environment docs docs-build
