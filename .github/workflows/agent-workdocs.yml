name: Agent work documents

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-workdocs:
    name: Temporary agent work documents
    runs-on: ubuntu-latest
    env:
      # Full SHA of a published devtools commit containing the check.
      DEVTOOLS_REF: ${{ vars.DEVTOOLS_REF }}
    steps:
      - name: Require an immutable devtools version
        shell: bash
        run: |
          if [[ ! "$DEVTOOLS_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Stel DEVTOOLS_REF in op de volledige SHA van een gepubliceerde devtools-commit met de controle. Een branch, tag of lege waarde is niet toegestaan."
            exit 1
          fi

      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          path: target
          persist-credentials: false

      - name: Check out pinned devtools
        uses: actions/checkout@v4
        with:
          repository: d2hydro/devtools
          ref: ${{ env.DEVTOOLS_REF }}
          path: devtools
          # For private devtools, provide a token with Contents: read on devtools.
          token: ${{ secrets.DEVTOOLS_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check tracked temporary documents
        run: python -I devtools/scripts/check_agent_workdocs.py --repo target
