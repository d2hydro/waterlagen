name: Conda package

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.70.1
          run-install: false

      - name: Build and test installed package
        run: pixi exec --spec rattler-build=0.76.1 rattler-build build --recipe recipe/recipe.yaml --output-dir .cache/conda-build --log-style plain

      - name: Index local conda channel
        run: pixi exec --spec rattler-index=0.31.5 rattler-index fs .cache/conda-build --force

      - name: Store local conda channel
        uses: actions/upload-artifact@v7
        with:
          name: conda-channel-${{ matrix.os }}
          path: |
            .cache/conda-build/noarch/*.conda
            .cache/conda-build/noarch/repodata.json
          if-no-files-found: error
