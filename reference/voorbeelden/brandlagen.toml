# Voorbeeld met negen BGT-, TOP10NL- en OSM-lagen, op basis van Aa en Maas.
# Sla deze TOML op als invoer/brandlagen.toml.
# De paden gebruiken de standaardgegevensmap data/ naast invoer/.
# openbare_bron kiest automatische voorbereiding door de productieopdracht.
# BGT en OSM worden gebiedsgericht opgehaald, inclusief tegelbuffers.
# TOP10NL gebruikt het landelijke GeoPackage.
# Zonder openbare_bron blijft een laag uitsluitend eigen lokale invoer.
# Relatieve paden zijn relatief aan dit TOML-bestand.
# Hoogste prioriteitsgetal wint. De volgorde hieronder bepaalt geen voorrang.
# Gezamenlijke water-/duikerverwerking op het bestaande 2m-raster.
geisoleerde_branddiepte_m = 10.0

# Aanvullende brandlagen worden standaard 10 meter verlaagd.
# Een waarde bij de laag of het bronobject gaat voor.
# Dit verandert de verlagingen voor HyDAMO en Rijkswateren niet.
[defaults]
brandwaarde = -10.0

[[lagen]]
path = "../data/source_data/bgt/bgt.gpkg"
layer = "bgt_waterdeel"
openbare_bron = "bgt"
rol = "water"
prioriteit = 2

[[lagen]]
path = "../data/source_data/top10nl/top10nl_Compleet.gpkg"
layer = "top10nl_waterdeel_vlak"
openbare_bron = "top10nl"
brandwaarde = -5.0
rol = "water"
prioriteit = 0

[[lagen]]
path = "../data/source_data/top10nl/top10nl_Compleet.gpkg"
layer = "top10nl_waterdeel_lijn"
openbare_bron = "top10nl"
brandwaarde = -5.0
rol = "water"
prioriteit = 0

# BGT-duikerselectie voor de gekozen rekentegels inclusief buffers.
# Geldige lijnen en vlakken blijven behouden; de mapnaam bepaalt geen selectie.
# BGT: alleen kunstwerkdelen met plus-type = duiker.
[[lagen]]
path = "../data/processed_data/brandlagen/aa_en_maas/bgt_duikers.gpkg"
layer = "bgt_duiker"
openbare_bron = "bgt"
rol = "duiker"
bron = "bgt"
prioriteit = 2

# OSM wordt opgehaald voor het rekengebied inclusief buffer.
# Alleen tunnel=culvert; bronvoorkeur HYDAMO, BGT, OSM.
[[lagen]]
path = "../data/source_data/osm/osm_culverts.gpkg"
layer = "osm_culvert"
openbare_bron = "osm"
rol = "duiker"
bron = "osm"
prioriteit = 1

# OSM-kanalen als aanvullende waterlijnen.
# Dit selecteert waterway=canal zonder ondergrondse trajecten.
[[lagen]]
path = "../data/source_data/osm/osm_canals.gpkg"
layer = "osm_canals"
openbare_bron = "osm"
rol = "water"
bron = "osm"
brandwaarde = -5.0
prioriteit = 1

# OSM-sloten en greppels (waterway=ditch).
[[lagen]]
path = "../data/source_data/osm/osm_ditches.gpkg"
layer = "osm_ditches"
openbare_bron = "osm"
rol = "water"
bron = "osm"
brandwaarde = -5.0
prioriteit = 1

# OSM-afvoerwatergangen (waterway=drain).
[[lagen]]
path = "../data/source_data/osm/osm_drains.gpkg"
layer = "osm_drains"
openbare_bron = "osm"
rol = "water"
bron = "osm"
brandwaarde = -5.0
prioriteit = 1

# OSM-beken (waterway=stream).
[[lagen]]
path = "../data/source_data/osm/osm_streams.gpkg"
layer = "osm_streams"
openbare_bron = "osm"
rol = "water"
bron = "osm"
brandwaarde = -5.0
prioriteit = 1

# Optioneel: BGT-wegdelen, standaard uit. Verwijder de commentaartekens
# vanaf [[lagen]] tot en met prioriteit om deze laag te gebruiken.
# Een positieve brandwaarde verhoogt; 2.0 m is instelbaar, geen aanbevolen waarde.
# [[lagen]]
# path = "../data/source_data/bgt/bgt_wegdeel.gpkg"
# layer = "bgt_wegdeel"
# openbare_bron = "bgt"
# rol = "overig"
# brandwaarde = 2.0
# prioriteit = 3

# Optioneel: eigen waterloopcorrecties gaan voor BGT en TOP10NL.
# [[lagen]]
# path = "eigen_brandlagen.gpkg"
# layer = "correcties"
# prioriteit = 3
# Een dam of blokkering vraagt een positieve brandwaarde, bijvoorbeeld:
# brandwaarde = 1.0
