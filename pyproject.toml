[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "waterlagen"
description = "Waterlagen: rasters en features downloaden en bewerken voor toepassing in waterbeheer"
readme = "README.md"
keywords = ["hydrologie", "waterbeheer", "PDOK", "BAG", "BGT", "AHN"]
authors = [
    { name = "Daniel Tollenaar", email = "daniel@d2hydro.nl" },
    { name = "Wouter van Esse", email = "w.vanesse@hhnk.nl" }
]
license = { text = "MIT" }

urls = { "Source" = "https://github.com/d2hydro/waterlagen", "Documentation" = "https://d2hydro.github.io/waterlagen/" }

requires-python = ">=3.11"
dependencies = [
    "gdal",
    "geopandas>=1.0",
    "pandas>=2",
    "pydantic>=2",
    "pydantic-settings",
    "rasterio",
    "pyogrio",
    "pyproj",
    "pyarrow",
    "numpy",
    "requests",
    "shapely>=2",
    "affine",
    "tqdm"
]
dynamic = ["version"]

[project.scripts]
waterlagen = "waterlagen.cli:main"

[project.optional-dependencies]
tests = ["pytest"]

[tool.hatch.version]
source = "vcs"
tag-pattern = '^v?(?P<version>\d{4}\.\d{1,2}\.\d+(?:(?:a|b|rc)\d+)?(?:\.post\d+)?(?:\.dev\d+)?)$'

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[tool.hatch.build.targets.wheel]
packages = ["src/waterlagen"]
include = ["src/waterlagen/styles/*.qml"]

[tool.coverage.run]
source = ["src/waterlagen"]
concurrency = ["multiprocessing", "thread"]
parallel = true

