site_name: Waterlagen
repo_url: https://github.com/d2hydro/waterlagen
repo_name: d2hydro/waterlagen

theme:
  name: material
  custom_dir: overrides
  language: nl
  logo: icons/logo.png
  favicon: icons/favicon.png
  highlightjs: true
  features:
    - navigation.tabs
    - content.code.copy
  palette:
    primary: custom

nav:
  - Over Waterlagen: index.md
  - Bronlagen:
      - Overzicht: bronlagen/index.md
      - AHN: bronlagen/ahn.md
      - BAG: bronlagen/bag.md
      - Bestuurlijke gebieden: bronlagen/bestuurlijke-gebieden.md
      - BGT: bronlagen/bgt.md
      - BRP: bronlagen/brp.md
      - CBS Wijk- en Buurtkaart en Kerncijfers: bronlagen/cbs.md
      - Dijkringen: bronlagen/dijkringen.md
      - GKW HYDAMO: bronlagen/hydamo.md
      - LIWO overstromingsgevoelige gebieden: bronlagen/liwo.md
      - OSM-drinkwaterlocaties: bronlagen/osm-drinkwater.md
      - TOP10NL: bronlagen/top10nl.md
      - Waterketen DAMO: bronlagen/waterketen-damo.md
      - Waterschapsgrenzen: bronlagen/waterschapsgrenzen.md
  - Bewerkte lagen:
      - Overzicht: bewerkte-lagen/index.md
      - Afwateringseenheden: bewerkte-lagen/afwateringseenheden.md
      - Auto's: bewerkte-lagen/autos.md
      - Functioneel landgebruik: bewerkte-lagen/functioneel-landgebruik.md
      - Hoogtemodel: bewerkte-lagen/dem.md
      - Inwoners: bewerkte-lagen/inwoners.md
  - Zelf produceren:
      - Overzicht: produceren/index.md
      - Installatie: produceren/installatie.md
      - Productiecommando's: produceren/cli.md
      - Opslag van gegevens: produceren/configuratie.md
      - Afwateringseenheden: produceren/afwateringseenheden.md
      - Functioneel landgebruik: produceren/landgebruik.md
      - DEM: produceren/dem.md
      - BGT-vlakken voor QGIS: produceren/bgt-vlakken.md
      - Waterketen DAMO downloaden: produceren/waterketen-damo.md
      - Inwoners en personenauto's: produceren/inwoners-personenautos.md
  - Python:
      - Aan de slag: reference/gebruik.md
      - Bronlagen downloaden: reference/bronlagen-downloaden.md
      - Bewerkte lagen samenstellen: reference/bewerkte-lagen-produceren.md
      - API-referentie:
          - Overzicht: reference/api.md
          - Productie-ingangen: reference/productie.md
          - AHN: reference/ahn.md
          - DEM: reference/dem.md
          - BAG: reference/bag.md
          - BGT: reference/bgt.md
          - BRP: reference/brp.md
          - CBS: reference/cbs.md
          - TOP10NL: reference/top10nl.md
          - Dijkringen: reference/dijkringen.md
          - Administratieve gebieden: reference/administratieve_gebieden.md
          - Afwateringseenheden: reference/afwateringseenheden.md
          - Auto's: reference/autos.md
          - Functioneel landgebruik: reference/functioneel_landgebruik.md
          - Inwoners: reference/inwoners.md
          - Woon-VBO's per buurt: reference/vbo_buurt.md
          - HYDAMO: reference/hydamo.md
          - LIWO: reference/liwo.md
          - OSM-drinkwaterlocaties: reference/osm_drinkwater.md
          - Waterketen DAMO: reference/waterketen_damo.md
          - DataStore: reference/datastore.md
          - Rasters: reference/raster.md
  - Bijdragen:
      - Overzicht: bijdragen/index.md
      - Ontwikkelomgeving: bijdragen/ontwikkelomgeving.md
      - Afwateringseenheden-benchmark: bijdragen/afwateringseenheden-scaling.md
      - Conventies: bijdragen/conventions.md
      - AI coding agents: bijdragen/ai-agents.md

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include: ["*.ipynb"]
      # Skip API Markdown before Jupytext interprets mkdocstrings' ::: directives.
      ignore: ["*.md"]
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_style: numpy

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css
