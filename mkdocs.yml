site_name: Waterlagen
repo_url: https://github.com/d2hydro/waterlagen
repo_name: d2hydro/waterlagen

theme:
  name: material
  language: nl
  logo: icons/logo.png
  favicon: icons/favicon.png
  highlightjs: true
  features:
    - navigation.tabs
    - content.code.copy
  palette:
    primary: custom

nav:
  - Over Waterlagen: index.md
  - Bronnen:
      - Overzicht: bronnen/index.md
      - AHN: bronnen/ahn.md
      - BAG: bronnen/bag.md
      - BGT: bronnen/bgt.md
      - BRP: bronnen/brp.md
      - TOP10NL: bronnen/top10nl.md
      - Dijkringen: bronnen/dijkringen.md
      - GKW HYDAMO: bronnen/hydamo.md
      - Bestuurlijke gebieden: bronnen/bestuurlijke-gebieden.md
      - Waterschapsgrenzen: bronnen/waterschapsgrenzen.md
  - Bewerkingen:
      - Overzicht: bewerkingen/index.md
      - AHN interpoleren: bewerkingen/ahn-interpoleren.md
      - BAG-vloerpeilen: bewerkingen/bag-vloerpeilen.md
      - Functioneel landgebruik: bewerkingen/functioneel-landgebruik.md
      - Afwateringseenheden: bewerkingen/afwateringseenheden.md
  - Zelf produceren:
      - Overzicht: produceren/index.md
      - Installatie: produceren/installatie.md
      - Configuratie en DataStore: produceren/configuratie.md
      - Eerste dataset produceren: produceren/eerste-dataset.md
      - Afwateringseenheden: produceren/afwateringseenheden.md
  - API-referentie:
      - AHN: reference/ahn.md
      - BAG: reference/bag.md
      - BGT: reference/bgt.md
      - BRP: reference/brp.md
      - TOP10NL: reference/top10nl.md
      - Dijkringen: reference/dijkringen.md
      - Administratieve gebieden: reference/administratieve_gebieden.md
      - Afwateringseenheden: reference/afwateringseenheden.md
      - Functioneel landgebruik: reference/functioneel_landgebruik.md
      - HYDAMO: reference/hydamo.md
      - DataStore: reference/datastore.md
      - Rasters: reference/raster.md
  - Bijdragen:
      - Overzicht: bijdragen/index.md
      - Ontwikkelomgeving: bijdragen/ontwikkelomgeving.md
      - Conventies: bijdragen/conventions.md
      - AI coding agents: bijdragen/ai-agents.md

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_style: numpy

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css
